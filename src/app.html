<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8e2d6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0808" />
    <script>
      document.documentElement.setAttribute("theme", localStorage.getItem("theme") || "system");
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
